<!DOCTYPE html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animal Cards</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f4f4f4;
        }

        .cards-container {
            display: flex;
            justify-content: space-between;
            gap: 20px;
        }

        .card {
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            width: 30%;
            overflow: hidden;
        }

        .card img {
            width: 100%;
            height: auto;
        }

        .card-content {
            padding: 15px;
        }

        .card h2 {
            font-size: 20px;
            margin: 0 0 10px;
        }

        .card p {
            font-size: 16px;
            color: #555;
            margin: 0;
        }
    </style>
</head>
<body>

<div class="cards-container">
    <!-- Card  -->
    <div class="card">
        <img src="file:///C:\Users\andre\Desktop\lyfter andres\images\lion.png" alt="Animal 1">
        <div class="card-content">
            <h2>Lion</h2>
            <p>The lion is known as the king of the jungle is one of the most powerful animals.</p>
        </div>
    </div>

    <div class="card">
        <img src="file:///C:\Users\andre\Desktop\lyfter andres\images\elefante.png" alt="Animal 2">
        <div class="card-content">
            <h2>Elephant</h2>
            <p>Elephants are the largest land animals they are known for their intelligence and memory</p>
        </div>
    </div>

    <div class="card">
        <img src="file:///C:\Users\andre\Desktop\lyfter andres\images\tiger.png" alt="Animal 3">
        <div class="card-content">
            <h2>Tiger</h2>
            <p>The tiger is a fierce predator and one of the largest wild cats in the world.</p>
        </div>
    </div>
</div>

</body>
</html>
